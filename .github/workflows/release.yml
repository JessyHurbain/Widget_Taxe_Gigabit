name: Build et release

# Déclenché par un tag de version (ex. v1.0.0) : compile les trois systèmes et
# publie une release GitHub avec les binaires produits.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Tk système (le Python du runner n'a pas tkinter)
        run: sudo apt-get update && sudo apt-get install -y python3-tk python3-venv
      - name: Compiler
        run: |
          /usr/bin/python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --upgrade pip
          /tmp/venv/bin/pip install pyinstaller psutil
          /tmp/venv/bin/python -m PyInstaller --noconfirm --clean --onefile \
            --windowed --name TaxeGigabit taxe_gigabit.py
          tar -czf TaxeGigabit-linux-x86_64.tar.gz -C dist TaxeGigabit
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: TaxeGigabit-linux-x86_64.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compiler
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller psutil
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name TaxeGigabit taxe_gigabit.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/TaxeGigabit.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compiler
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller psutil
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name TaxeGigabit taxe_gigabit.py
      - name: Empaqueter le .app
        run: ditto -c -k --keepParent dist/TaxeGigabit.app TaxeGigabit-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: TaxeGigabit-macos-arm64.zip
          if-no-files-found: error

  release:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
